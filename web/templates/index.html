<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPL Analytics</title>
  <style>
    :root { --navy:#1f2937; --teal:#0f766e; --amber:#d97706; --mist:#f5f7fa; --white:#fff; }
    * { box-sizing:border-box; } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; } body { margin:0; height:100dvh; overflow:hidden; background:var(--mist); color:var(--navy); font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; } button,textarea { font:inherit; }
    .app { display:flex; flex-direction:column; height:100%; max-width:1120px; margin:auto; padding:16px; }.topbar { display:flex; flex:0 0 auto; align-items:center; justify-content:space-between; gap:16px; padding:0 4px 12px; }.brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:700; }.brand-mark { display:grid; width:28px; height:28px; place-items:center; border-radius:7px; background:var(--teal); color:var(--white); font-size:14px; }.status { color:var(--teal); font-size:12px; font-weight:500; }
    .workspace { display:flex; min-height:0; flex:1; flex-direction:column; overflow:hidden; border:1px solid color-mix(in srgb,var(--navy) 12%,transparent); border-radius:12px; background:var(--white); }.workspace-head { flex:0 0 auto; padding:14px 18px; border-bottom:1px solid color-mix(in srgb,var(--navy) 10%,transparent); }.workspace-head h1 { margin:0; font-size:16px; font-weight:650; }.workspace-head p { margin:2px 0 0; color:color-mix(in srgb,var(--navy) 65%,var(--white)); font-size:12px; }
    #chat { flex:1 1 auto; min-height:0; overflow-y:auto; padding:18px; scrollbar-color:color-mix(in srgb,var(--teal) 45%,transparent) transparent; }.chat-stack { display:flex; flex-direction:column; gap:12px; max-width:920px; margin:auto; }.message { max-width:88%; padding:11px 13px; border:1px solid color-mix(in srgb,var(--navy) 10%,transparent); border-radius:10px; background:var(--mist); color:var(--navy); }.message-intro { border-left:3px solid var(--teal); }.message-label { display:block; margin-bottom:3px; color:var(--teal); font-size:11px; font-weight:700; }.chat-user { align-self:flex-end; border-color:var(--teal); background:var(--teal); color:var(--white); }.chat-progress { display:flex; align-items:center; gap:8px; }.pulse { width:7px; height:7px; flex:0 0 auto; border-radius:50%; background:var(--amber); animation:pulse 1.3s infinite; } @keyframes pulse { 50% { opacity:.35; } }
    .analysis-card { max-width:100%; background:var(--white); }.analysis-title { margin:0; color:var(--teal); font-size:12px; font-weight:700; }.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-top:12px; }.kpi { padding:10px; border:1px solid color-mix(in srgb,var(--navy) 10%,transparent); border-radius:8px; background:var(--mist); }.kpi-name { color:color-mix(in srgb,var(--navy) 66%,var(--white)); font-size:11px; }.kpi-value { display:block; margin-top:2px; font-size:17px; font-weight:700; }.insights { padding-left:18px; margin:12px 0 0; }.insights li+li { margin-top:6px; }
    .chart { margin-top:14px; padding-top:12px; border-top:1px solid color-mix(in srgb,var(--navy) 10%,transparent); }.chart-type { margin:0; color:color-mix(in srgb,var(--navy) 65%,var(--white)); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }.chart h3 { margin:2px 0; font-size:14px; }.chart p { margin:0; color:color-mix(in srgb,var(--navy) 70%,var(--white)); }.bar-list { display:grid; gap:7px; margin-top:10px; }.bar-row { display:grid; grid-template-columns:minmax(80px,1fr) 2fr auto; gap:10px; align-items:center; font-size:12px; }.bar-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.bar-track { height:7px; overflow:hidden; border-radius:99px; background:color-mix(in srgb,var(--teal) 13%,var(--white)); }.bar-value { display:block; height:100%; border-radius:inherit; background:var(--teal); }.bar-number { color:var(--amber); font-weight:700; }.chart-axis { margin-top:9px!important; font-size:11px; }
    #chat-form { position:sticky; bottom:0; flex:0 0 auto; padding:12px 18px; border-top:1px solid color-mix(in srgb,var(--navy) 10%,transparent); background:var(--white); }.composer { display:flex; gap:8px; max-width:920px; margin:auto; }textarea { min-height:42px; max-height:104px; flex:1; resize:none; padding:10px 11px; border:1px solid color-mix(in srgb,var(--navy) 18%,transparent); border-radius:8px; outline:none; color:var(--navy); }textarea:focus { border-color:var(--teal); box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 16%,transparent); }.ask-button { min-width:66px; border:0; border-radius:8px; background:var(--teal); color:var(--white); font-weight:650; cursor:pointer; }.ask-button:disabled { cursor:wait; opacity:.55; }.suggestions { display:flex; gap:12px; max-width:920px; margin:8px auto 0; overflow-x:auto; }.suggestion { padding:0; border:0; background:none; color:color-mix(in srgb,var(--navy) 68%,var(--white)); font-size:12px; cursor:pointer; white-space:nowrap; }.suggestion:hover { color:var(--teal); }
    @media (max-width:560px) { .app { padding:8px; }.topbar { padding:4px 2px 9px; }.status { display:none; }.workspace-head,#chat,#chat-form { padding-left:12px; padding-right:12px; }.message { max-width:96%; }.suggestions { gap:10px; } }
  </style>
</head>
<body>
  <main class="app"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">🏏</span><span>IPL Analytics</span></div><div id="service-status" class="status">Checking analytics service…</div></header>
    <section class="workspace" aria-label="IPL analytics chat"><div class="workspace-head"><h1>Cricket data assistant</h1><p>Ask focused IPL questions and get statistical answers.</p></div>
      <div id="chat" aria-live="polite"><div class="chat-stack"><article class="message message-intro"><span class="message-label">IPL Analytics</span>Ask about players, teams, seasons, venues, batting, or bowling.</article></div></div>
      <form id="chat-form"><div class="composer"><label class="sr-only" for="message">Your IPL question</label><textarea id="message" rows="1" maxlength="1000" required placeholder="Ask an IPL question…"></textarea><button id="send" class="ask-button" type="submit">Ask</button></div><div class="suggestions"><button type="button" class="suggestion">Kohli's improvement over the years</button><button type="button" class="suggestion">Best bowlers at Wankhede</button><button type="button" class="suggestion">Top death-over hitters</button></div></form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
